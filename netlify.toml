[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ─── API routes ──────────────────────────────────────────────
[[redirects]]
  from   = "/api/snapshots"
  to     = "/.netlify/functions/snapshots"
  status = 200

[[redirects]]
  from   = "/api/snapshots/:period"
  to     = "/.netlify/functions/snapshots"
  status = 200

[[redirects]]
  from   = "/api/view-auth"
  to     = "/.netlify/functions/view-auth"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, X-Admin-Password, X-View-Password"

# ─── SPA fallback ────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
